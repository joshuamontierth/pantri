services:
  shopping:
    build: .
    container_name: shopping-list
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - shopping-data:/data
    environment:
      # Set to "true" if you serve the site over HTTPS (e.g. behind a TLS reverse proxy).
      COOKIE_SECURE: "false"
      # Vision model for importing recipes from photos and tidying imported links. "" turns photos off.
      OLLAMA_URL: "http://ollama.example.com:11434"
      OLLAMA_MODEL: "gemma4:26b-a4b-it-qat"

volumes:
  shopping-data:
