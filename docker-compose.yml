services:
  shopping:
    build: .
    container_name: shopping-list
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - shopping-data:/data
    # Settings come from .env next to this file (copy .env.example); see the README's Configuration.
    environment:
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      OLLAMA_URL: "${OLLAMA_URL:-}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma4:26b-a4b-it-qat}"
      OLLAMA_TIMEOUT: "${OLLAMA_TIMEOUT:-300}"
      OLLAMA_NUM_CTX: "${OLLAMA_NUM_CTX:-8192}"
      TIMEZONE: "${TIMEZONE:-UTC}"

volumes:
  shopping-data:
