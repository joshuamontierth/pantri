{% extends "base.html" %}
{% block title %}Sign up · Pantri{% endblock %}
{% block body_class %}auth-body{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="brand"><span class="brand-mark">{{ icon("check", 16, 3) }}</span>Pantri</div>
  <h1 class="page-title">Create an account</h1>
  {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
  <form method="post" action="/signup" class="stack">
    <label class="field">
      <span class="field-label">Username</span>
      <input name="username" value="{{ username or '' }}" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"
             pattern="[A-Za-z0-9_.\-]{3,32}" title="3 to 32 letters, numbers, dots, dashes or underscores" required autofocus>
    </label>
    <label class="field">
      <span class="field-label">Password</span>
      <input type="password" name="password" autocomplete="new-password" minlength="8" required>
      <span class="field-hint">At least 8 characters</span>
    </label>
    <label class="field">
      <span class="field-label">Confirm password</span>
      <input type="password" name="confirm" autocomplete="new-password" minlength="8" required>
    </label>
    <button class="btn primary block">Sign up</button>
  </form>
  <p class="muted center">Already have an account? <a href="/login">Log in</a></p>
</div>
{% endblock %}
