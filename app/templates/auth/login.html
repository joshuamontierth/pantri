{% extends "base.html" %}
{% block title %}Log in · Shopping List{% endblock %}
{% block body_class %}auth-body{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="brand"><span class="brand-mark">{{ icon("check", 16, 3) }}</span>Shopping List</div>
  <h1 class="page-title">Log in</h1>
  {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field">
      <span class="field-label">Username</span>
      <input name="username" value="{{ username or '' }}" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
    </label>
    <label class="field">
      <span class="field-label">Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn primary block">Log in</button>
  </form>
  <p class="muted center">No account yet? <a href="/signup">Sign up</a></p>
</div>
{% endblock %}
