{% for e in errors %}<p class="alert error">{{ e }}</p>{% endfor %}
<ul class="pick-list">
  {% for row in rows %}
  <li class="pick-row{{ ' on' if row.included }}">
    <label class="pick-check">
      <input type="checkbox" class="box" name="include" value="{{ row.id }}"{{ ' checked' if row.included }}>
      <span class="pick-text">
        <span class="pick-line">
          <span class="pick-name">{{ row.catalog_item.name }}</span>
          {% if row.qty_text %}<span class="pick-qty">{{ row.qty_text }}</span>{% endif %}
        </span>
        {% if row.tags|length > 1 %}<span class="item-tags">for {{ row.tags|join(", ") }}</span>{% endif %}
        {% if row.on_list %}<span class="on-list">Already on {{ row.on_list|join(", ") }}</span>{% endif %}
      </span>
    </label>
    <select name="store_{{ row.id }}" class="pick-store" aria-label="Store for {{ row.catalog_item.name }}">
      {% if row.ranked_opts %}
      <optgroup label="Your stores for this">
        {% for key, name, rank in row.ranked_opts %}<option value="{{ key }}" data-name="{{ name }}"{{ ' selected' if key == row.selected }}>{{ name }} · {{ rank }}</option>{% endfor %}
      </optgroup>
      {% endif %}
      {% if row.other_opts %}
      <optgroup label="Other stores">
        {% for key, name, rank in row.other_opts %}<option value="{{ key }}" data-name="{{ name }}"{{ ' selected' if key == row.selected }}>{{ name }}</option>{% endfor %}
      </optgroup>
      {% endif %}
      <option value="none" data-name="{{ OTHER_LABEL }}"{{ ' selected' if row.selected == 'none' }}>{{ OTHER_LABEL }}</option>
    </select>
  </li>
  {% else %}
  <li class="muted">These recipes have no ingredients.</li>
  {% endfor %}
</ul>
